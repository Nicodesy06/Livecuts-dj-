name: test-and-build-windows

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System libraries (Qt offscreen, PortAudio)
        run: sudo apt-get update && sudo apt-get install -y libegl1 libportaudio2 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -r requirements-lock.txt && pip install -e . --no-deps && pip install pytest websockets
      - run: pytest tests -q
        env:
          QT_QPA_PLATFORM: offscreen

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build, test, package and self-test the executables
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts\build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: DJDirectorAI-win64
          path: dist/DJDirectorAI-*-win64.zip
