name: test-and-build-windows

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a GitHub Release with this tag (e.g. v0.1.1). Leave empty to only build."
        required: false
        default: ""

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System libraries (Qt offscreen, PortAudio)
        run: sudo apt-get update && sudo apt-get install -y libegl1 libportaudio2 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -r requirements-lock.txt && pip install -e . --no-deps && pip install pytest websockets
      - run: pytest tests -q
        env:
          QT_QPA_PLATFORM: offscreen

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build, test, package and self-test the executables
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts\build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: DJDirectorAI-win64
          path: |
            dist/DJDirectorAI-*-win64.zip
            dist/Guida_DJ_Director_AI.pdf

  # A pushed tag vX.Y.Z, or a manual run with release_tag set, creates the GitHub Release
  # (and the tag, on the built commit) with the verified Windows build attached.
  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: [test-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: DJDirectorAI-win64
          path: out
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          ls -la out
          notes="docs/release-notes/${TAG}.md"
          [ -f "$notes" ] || notes="README.md"
          gh release create "$TAG" out/DJDirectorAI-*-win64.zip out/Guida_DJ_Director_AI.pdf \
            --target "$GITHUB_SHA" --title "DJ Director AI ${TAG#v}" --notes-file "$notes"
