[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dj-director-ai"
version = "0.1.1"
description = "Automatic music-aware multicamera director for DJ performances, controlling OBS Studio via obs-websocket 5.x"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Nicola Mantovani" }]
dependencies = [
    "numpy>=1.26",
    "PySide6-Essentials>=6.6",
    "sounddevice>=0.4.6",
    "soundfile>=0.12",
    "websocket-client>=1.6",
]

[project.optional-dependencies]
# WASAPI loopback capture (Windows only). Optional: the app degrades gracefully without it.
loopback = ["PyAudioWPatch>=0.2.12; platform_system == 'Windows'"]
dev = ["pytest>=7.4", "websockets>=12", "pyinstaller>=6.3"]

[project.scripts]
dj-director = "dj_director.app:main"

[project.gui-scripts]
dj-director-gui = "dj_director.app:main_gui"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dj_director = ["ui/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
